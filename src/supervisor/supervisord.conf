[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=/opt/alertiny/start-api.sh
directory=/opt/alertiny
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/python -m scheduler.main
directory=/opt/alertiny
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0