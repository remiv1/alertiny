[supervisord]
# Maintien du processus en avant-plan pour la supervision
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
# Lancement de l'API Alertiny
command=/opt/alertiny/start-api.sh
directory=/opt/alertiny
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
# Redirection des logs vers la sortie standard et la sortie d'erreur pour l'API Alertiny
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
# Lancement du planificateur de tâches Alertiny
command=/usr/local/bin/python -m scheduler.main
directory=/opt/alertiny
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
# Redirection des logs vers la sortie standard et la sortie d'erreur pour le planificateur de tâches Alertiny
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0